name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/docpilot/models
          key: embedding-models-${{ hashFiles('backend/src/docpilot/config.py') }}
      - run: just setup
      - run: just check

  # Deploys main to Cloud Run once checks pass. Skipped until the repo variables exist
  # (see "Deploying" in the README). Authenticates with Workload Identity Federation:
  # no service-account keys are stored anywhere.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docpilot/docpilot:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate and load demo documents
        run: |
          gcloud run jobs update docpilot-migrate --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute docpilot-migrate --region "$REGION" --wait
      - name: Deploy
        run: gcloud run services update docpilot --image "$IMAGE" --region "$REGION" --quiet
      - name: Smoke test
        run: |
          url=$(gcloud run services describe docpilot --region "$REGION" --format='value(status.url)')
          curl -sf --retry 5 --retry-all-errors "$url/api/health"
          curl -sf "$url/api/documents" | grep -q aurora_knowledge_base.pdf
          if [ -n "$PUBLIC_URL" ]; then  # the custom domain, through the Cloudflare Worker
            curl -sf --retry 5 --retry-all-errors "$PUBLIC_URL/api/health"
          fi
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
