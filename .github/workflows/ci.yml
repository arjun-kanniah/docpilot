name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/docpilot/models
          key: embedding-models-${{ hashFiles('backend/src/docpilot/config.py') }}
      - run: just setup
      - run: just check

  # Deploys main to Cloud Run once checks pass, with cloudrun-blueprint's reusable workflow.
  # Skipped until the repo variables exist (see "Deploying" in the README). Authenticates with
  # Workload Identity Federation: no service-account keys are stored anywhere.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write
    uses: arjun-kanniah/cloudrun-blueprint/.github/workflows/deploy.yml@v0.1.0
    with:
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_DEPLOY_SA }}
      region: ${{ vars.GCP_REGION }}
      service: docpilot
      image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docpilot/docpilot
      jobs: docpilot-migrate
      health_path: /api/health
      public_url: ${{ vars.PUBLIC_URL }}

  # The migration job also loads the demo PDF; check the live library has it.
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - run: curl -sf --retry 5 --retry-all-errors "$URL/api/documents" | grep -q aurora_knowledge_base.pdf
        env:
          URL: ${{ needs.deploy.outputs.url }}
